name: Package plugin

on:
  workflow_dispatch:

jobs:
  tag_next_version:
    name: Tag next version number
    runs-on: [ubuntu-latest]
    permissions:
      contents: write

    outputs:
      next_version: ${{ env.NEXT_VERSION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get latest tag
        id: latest_tag
        run: |
          export VERSION=`git describe --tags --abbrev=0`
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest version is $VERSION" >> $GITHUB_STEP_SUMMARY

      - name: Debug latest tag condition
        run: |
          echo "Latest tag contains -rc? ${{ contains('-rc', steps.latest_tag.outputs.tag) }}" >> $GITHUB_STEP_SUMMARY

      # Last tag is a full release version, determine upcoming first RC
      - name: Determine version
        id: version_info
        if: ${{ !contains('-rc', steps.latest_tag.outputs.tag) }}
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main

      - name: Save next version
        if: ${{ !contains('-rc', steps.latest_tag.outputs.tag) }}
        run: |
          echo "NEXT_VERSION=${{ steps.version_info.outputs.next }}-rc1" >> "$GITHUB_ENV"
          echo "Using next version $NEXT_VERSION" >> $GITHUB_STEP_SUMMARY

      # Last tag is a release candidate, count up RC number
      - name: Determine next RC version
        if: ${{ contains('-rc', steps.latest_tag.outputs.tag )}}
        uses: '$/.github/actions/release-candidate-increase'
        with:
          token: ${{ github.token }}

      - name: Save next RC version
        id: rc_version_info
        if: ${{ contains('-rc', steps.latest_tag.outputs.tag )}}
        run: |
          echo "NEXT_VERSION=${{ steps.rc_version_info.outputs.next }}" >> "$GITHUB_ENV"
          echo "Using bumped RC version $NEXT_VERSION" >> $GITHUB_STEP_SUMMARY

      - name: Create RC tag
        run: |
          echo "Would create tag ${{ env.NEXT_VERSION }} at this point"
